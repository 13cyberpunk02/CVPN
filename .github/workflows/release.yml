name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия без префикса v'
        required: true
        default: '1.0.0'

env:
  SINGBOX_VERSION: '1.14.3'
  # При смене версии нужно обновить и хеш: сборка с чужим архивом остановится
  BYEDPI_VERSION: '0.17.3'
  BYEDPI_SHA256: '70d2c94147193cb915f9c6eb5144b8d404dacbcfa90bda2383b6b211afafa456'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Определить версию
        id: version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $env:GITHUB_REF -replace 'refs/tags/v', ''
          } else {
            '${{ github.event.inputs.version }}'
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Публикация приложения
        run: >
          dotnet publish CVPN/CVPN.csproj -c Release -r win-x64
          --self-contained false
          -p:Version=${{ steps.version.outputs.value }}
          -o installer/payload

      - name: Публикация службы
        run: >
          dotnet publish CVPN.Service/CVPN.Service.csproj -c Release -r win-x64
          --self-contained false
          -p:Version=${{ steps.version.outputs.value }}
          -o installer/payload/service

      - name: Загрузка sing-box
        shell: pwsh
        run: |
          $url = "https://github.com/SagerNet/sing-box/releases/download/v$env:SINGBOX_VERSION/sing-box-$env:SINGBOX_VERSION-windows-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile sing-box.zip
          Expand-Archive sing-box.zip -DestinationPath sing-box -Force

          $core = Get-ChildItem sing-box -Filter sing-box.exe -Recurse | Select-Object -First 1

          # Одна копия на обе программы: служба ищет ядро на уровень выше своей папки
          New-Item -ItemType Directory -Path installer/payload/core -Force | Out-Null
          Copy-Item $core.FullName -Destination installer/payload/core

          # GPL-3.0: текст лицензии обязан ехать вместе с бинарником
          Get-ChildItem sing-box -Filter LICENSE -Recurse |
            Select-Object -First 1 |
            Copy-Item -Destination installer/payload/LICENSE.sing-box.txt

      - name: Загрузка ByeDPI
        shell: pwsh
        run: |
          # Тег v0.17.3, а файл byedpi-17.3-...: ведущий «0.» в имени архива опущен
          $short = $env:BYEDPI_VERSION -replace '^0\.', ''
          $url = "https://github.com/hufrea/byedpi/releases/download/v$env:BYEDPI_VERSION/byedpi-$short-x86_64-w64.zip"
          Invoke-WebRequest -Uri $url -OutFile byedpi.zip

          $actual = (Get-FileHash byedpi.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:BYEDPI_SHA256) {
            throw "Хеш ByeDPI не совпал: ожидался $env:BYEDPI_SHA256, получен $actual"
          }

          Expand-Archive byedpi.zip -DestinationPath byedpi -Force

          $ciadpi = Get-ChildItem byedpi -Filter ciadpi.exe -Recurse | Select-Object -First 1
          if (-not $ciadpi) { throw "В архиве ByeDPI нет ciadpi.exe" }

          # Только сам исполняемый файл: процессом управляет приложение
          New-Item -ItemType Directory -Path installer/payload/byedpi -Force | Out-Null
          Copy-Item $ciadpi.FullName -Destination installer/payload/byedpi

          # MIT: уведомление об авторских правах обязано ехать с бинарником, в архиве его нет
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/hufrea/byedpi/v$env:BYEDPI_VERSION/LICENSE" `
            -OutFile installer/payload/LICENSE.byedpi.txt

      - name: Установка Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Сборка установщика
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )

          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe не найден. Проверьте установку Inno Setup." }

          & $iscc "/DAppVersion=${{ steps.version.outputs.value }}" /DNeedsRuntime installer\CVPN.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup вернул код $LASTEXITCODE" }

      - name: Портативная сборка
        shell: pwsh
        run: |
          $out = "portable"

          dotnet publish CVPN/CVPN.csproj -c Release -r win-x64 --self-contained true `
            -p:Version=${{ steps.version.outputs.value }} -o $out
          dotnet publish CVPN.Service/CVPN.Service.csproj -c Release -r win-x64 --self-contained true `
            -p:Version=${{ steps.version.outputs.value }} -o "$out/service"

          Copy-Item installer/payload/core -Destination $out -Recurse
          Copy-Item installer/payload/LICENSE.sing-box.txt -Destination $out
          Copy-Item installer/payload/byedpi -Destination $out -Recurse
          Copy-Item installer/payload/LICENSE.byedpi.txt -Destination $out

          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path "$out/*" `
            -DestinationPath "dist/CVPN-${{ steps.version.outputs.value }}-portable.zip"

      - name: Публикация релиза
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}